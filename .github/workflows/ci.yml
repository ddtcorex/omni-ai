name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  # Blocking quality gate (typecheck + lint + unit).
  # Deliberately NO `name:` override on this job: Task 8 branch protection
  # requires a status check named exactly `verify`, and a check run's name
  # defaults to the job id — any `name:` value would replace it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: web-ext lint (manifest/CSP validation, non-blocking)
        run: npm run lint:webext
        continue-on-error: true

  # Playwright smoke E2E — blocking quality gate (since Task 12).
  # Runs the specs under e2e/ only: playwright.config.js scopes testDir +
  # testMatch so Jest's tests/**/*.test.js can never be swept.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # test-results/ is what Playwright actually writes on failure by
          # default; playwright-report/ stays empty unless the HTML reporter
          # is configured (see docs/FOLLOWUPS.md item 3 before changing it).
          path: test-results/
