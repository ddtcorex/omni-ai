name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  # Blocking quality gate (typecheck + lint + unit).
  # Deliberately NO `name:` override on this job: Task 8 branch protection
  # requires a status check named exactly `verify`, and a check run's name
  # defaults to the job id — any `name:` value would replace it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Playwright smoke E2E — non-blocking until the spec stabilizes.
  #
  # Fail-soft today: playwright.config.js does not exist until Task 12, so
  # each post-checkout step is guarded by hashFiles and the job skips
  # cleanly instead of failing on missing config/tests. The guard lives on
  # STEPS, not on the job: at job-if evaluation time no step has run yet,
  # the workspace is empty and hashFiles would return '' forever, silently
  # disabling e2e even after Task 12 adds the config.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    continue-on-error: true   # flip to false in Task 12 once smoke spec is stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: hashFiles('playwright.config.js') != ''
      - run: npx playwright install --with-deps chromium
        if: hashFiles('playwright.config.js') != ''
      - run: npx playwright test
        if: hashFiles('playwright.config.js') != ''
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
