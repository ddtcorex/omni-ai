<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omni AI</title>
    <link rel="stylesheet" href="../lib/design-tokens.css" />
    <link rel="stylesheet" href="../lib/design-system.css" />
    <link rel="stylesheet" href="sidepanel.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="../assets/icons/logo.svg" />
  </head>
  <body class="ds-backdrop">
    <div class="sidepanel-container">
      <header class="header">
        <div class="logo">
          <img src="../assets/icons/logo.svg" alt="__MSG_extName__" class="logo-icon" />
          <span class="logo-text">__MSG_popup_title__</span>
        </div>
        <button id="settingsBtn" class="ds-icon-btn" title="__MSG_settings_title__">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            ></path>
          </svg>
        </button>
      </header>

      <nav class="tab-nav" role="tablist">
        <button
          id="tabChat"
          class="tab-btn active"
          role="tab"
          aria-selected="true"
          data-view="chatView"
        >
          <span class="tab-icon"
            ><svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg
          ></span>
          <span class="tab-label">__MSG_sidebar_tab_chat__</span>
        </button>
        <button
          id="tabTools"
          class="tab-btn"
          role="tab"
          aria-selected="false"
          data-view="toolsView"
        >
          <span class="tab-icon"
            ><svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
              ></path></svg
          ></span>
          <span class="tab-label">__MSG_sidebar_tab_tools__</span>
        </button>
      </nav>

      <main class="page-tools">
        <section id="toolsView" class="tab-view hidden">
          <h2 class="page-tools-title">__MSG_sidepanel_title__</h2>

          <div class="action-buttons">
            <button id="summarizeBtn" class="ds-btn-primary ds-pill" data-action="summarize">
              <span class="action-icon"
                ><svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line></svg
              ></span>
              <span class="action-label">__MSG_sidepanel_summarize__</span>
            </button>
            <button id="translateBtn" class="ds-btn-primary ds-pill" data-action="smart_translate">
              <span class="action-icon"
                ><svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                  <path
                    d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
                  ></path></svg
              ></span>
              <span class="action-label">__MSG_sidepanel_translate__</span>
            </button>
            <button id="explainBtn" class="ds-btn-primary ds-pill" data-action="explain">
              <span class="action-icon"
                ><svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M9 18h6"></path>
                  <path d="M10 22h4"></path>
                  <path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"></path></svg
              ></span>
              <span class="action-label">__MSG_sidepanel_explain__</span>
            </button>
          </div>

          <div id="statusLine" class="status-line hidden"></div>
          <div id="loadingSpinner" class="ds-shimmer hidden" style="margin: 12px 0">
            <span></span><span></span><span></span>
          </div>

          <div id="resultArea" class="ds-card ds-surface hidden">
            <div class="result-label">__MSG_sidepanel_resultLabel__</div>
            <div id="resultSource" class="result-source"></div>
            <div id="resultText" class="result-text"></div>
          </div>
        </section>

        <section id="chatView" class="tab-view">
          <div class="chat-page-context">
            <div class="chat-context-row">
              <label class="chat-context-toggle">
                <input type="checkbox" id="includeContext" checked />
                <span>__MSG_sidebar_chat_includeContext__</span>
              </label>
              <button id="clearChatBtn" class="ds-icon-btn" title="__MSG_sidebar_chat_clear__">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path
                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                  ></path>
                </svg>
              </button>
            </div>
            <details class="chat-context-details">
              <summary>__MSG_sidebar_chat_pageContext__</summary>
              <pre id="pageContextPreview" class="chat-context-preview"></pre>
            </details>
          </div>

          <div id="chatMessages" class="chat-messages">
            <div class="chat-empty" id="chatEmpty">__MSG_sidebar_chat_empty__</div>
          </div>

          <div class="chat-error hidden" id="chatError">__MSG_sidebar_chat_error__</div>

          <div class="chat-input-row">
            <div class="chat-input-wrap">
              <textarea
                id="chatInput"
                class="chat-input"
                rows="2"
                placeholder="__MSG_sidebar_chat_placeholder__"
              ></textarea>
              <button id="chatSend" class="chat-fab chat-send" title="__MSG_sidebar_chat_send__">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
              <button
                id="chatStop"
                class="chat-fab chat-stop hidden"
                title="__MSG_sidebar_chat_stop__"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                </svg>
              </button>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span class="version" id="extVersion"></span>
      </footer>
    </div>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
